name: Reusable Workflow
on:
  workflow_call:
    inputs:
      foo:
        required: true
        type: string
      environment:
        description: "Target GitHub environment name (e.g. staging, production)"
        required: true
        type: string

jobs:
  reusable-workflow-job:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: job in reusable workflow
        env:
          FOO: ${{ inputs.foo }}
          ENVIRONMENT_SECRET: ${{ secrets.PASSWORD }}
          ENVIRONMENT_VARIABLE: ${{ vars.VALUE }}
        run: |
          echo "FOO                     = $FOO"
          echo "ENVIRONMENT_SECRET      = $ENVIRONMENT_SECRET"
          echo "ENVIRONMENT_VARIABLE    = $ENVIRONMENT_VARIABLE"