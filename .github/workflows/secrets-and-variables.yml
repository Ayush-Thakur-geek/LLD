name: secrets-and-variables
on:
  workflow_dispatch:

jobs:
  repo-level:
    runs-on: ubuntu-latest
    # no environment: sees repo-level values only
    steps:
      - name: Inspect values
        env:
          MY_SECRET: ${{ secrets.PASSWORD }}
          MY_VARIABLE: ${{ vars.VALUE }}
        run: |
          echo "Secret (masked): $MY_SECRET"
          echo "Secret length:   ${#MY_SECRET}"
          echo "Variable:        $MY_VARIABLE"

  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Inspect values
        env:
          MY_SECRET: ${{ secrets.PASSWORD }}
          MY_VARIABLE: ${{ vars.VALUE }}
        run: |
          echo "Secret (masked): $MY_SECRET"
          echo "Secret length:   ${#MY_SECRET}"
          echo "Variable:        $MY_VARIABLE"

  production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inspect values
        env:
          MY_SECRET: ${{ secrets.PASSWORD }}
          MY_VARIABLE: ${{ vars.VALUE }}
        run: |
          echo "Secret (masked): $MY_SECRET"
          echo "Secret length:   ${#MY_SECRET}"
          echo "Variable:        $MY_VARIABLE"